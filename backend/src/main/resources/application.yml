spring:
  application:
    name: Multi-Currency-Wallet

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}                  
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WalletHikariPool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000                   # 30 min — recycle before server kills it
      leak-detection-threshold: 60000         # warn if connection held > 60 s

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate                      # Flyway owns schema — Hibernate only validates
    show-sql: false                           
    open-in-view: false                       
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        format_sql: false

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false               # fail fast if schema is dirty

# ── JWT ───────────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}                    # min 32-char Base64 — must be set explicitly
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   

  # ── CORS ──────────────────────────────────────────────────────────────────
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics         
  endpoint:
    health:
      show-details: when-authorized          
  info:
    env:
      enabled: true

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.multi.currency.wallet: INFO                    
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
